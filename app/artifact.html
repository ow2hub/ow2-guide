<style>
  :root{
    --bg:#0d1220; --bg2:#141b2e; --card:#1a2338; --card2:#202b45;
    --ink:#e8edf7; --sub:#93a1c0; --line:#2a3552;
    --day:#f4b740; --night:#6c7bd6; --off:#4a5570;
    --sleep:#35507a; --free:#3fae7a; --accent:#4f8cff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

  /* now card */
  .now{background:linear-gradient(160deg,#1c2b4d,#16223c);border:1px solid rgba(79,140,255,.5);
    border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px}
  .now .ic{font-size:1.5rem;flex-shrink:0}
  .now .st{font-size:.68rem;color:var(--sub);letter-spacing:.5px}
  .now .main{font-weight:800;font-size:1.05rem;line-height:1.3}
  .now .cd{margin-left:auto;text-align:right;flex-shrink:0}
  .now .cd .t{font-size:1.1rem;font-weight:800;color:#7fa9ff}
  .now .cd .l{font-size:.64rem;color:var(--sub)}
  .app{max-width:460px;margin:0 auto;padding:0 0 40px}
  .proto{background:#3a2a12;color:#ffd479;text-align:center;font-size:.72rem;padding:5px;letter-spacing:1px}
  header.top{padding:16px 18px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px}
  header.top .logo{font-weight:800;color:#7fa9ff;letter-spacing:1px}
  header.top .tag{font-size:.66rem;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
  .sec{padding:16px 18px}
  .sec h2{font-size:.82rem;color:var(--sub);letter-spacing:1px;margin-bottom:12px;font-weight:700}

  /* block entry */
  .entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .types{display:flex;gap:8px;margin-bottom:12px}
  .type-btn{flex:1;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);
    border-radius:10px;padding:9px 0;font-size:.88rem;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
  .type-btn .ic{font-size:1.15rem}
  .type-btn[data-k="day"].on{border-color:var(--day);background:rgba(244,183,64,.16)}
  .type-btn[data-k="night"].on{border-color:var(--night);background:rgba(108,123,214,.18)}
  .type-btn[data-k="off"].on{border-color:var(--off);background:rgba(74,85,112,.28)}
  .row{display:flex;align-items:center;gap:12px}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:40px;height:42px;background:var(--card2);color:var(--ink);border:none;font-size:1.3rem;cursor:pointer}
  .stepper .n{width:54px;text-align:center;font-size:1.1rem;font-weight:800}
  .stepper .n small{font-size:.64rem;color:var(--sub);font-weight:400;display:block;margin-top:-4px}
  .add{flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;
    height:42px;font-size:.95rem;font-weight:800;cursor:pointer}
  .hint{font-size:.72rem;color:var(--sub);margin-top:8px;text-align:center}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head .mo{font-size:1.05rem;font-weight:800}
  .cal-head button{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    width:36px;height:36px;border-radius:9px;font-size:1.1rem;cursor:pointer}
  .cal-actions{display:flex;gap:10px;margin-top:10px;justify-content:flex-end}
  .cal-actions button{background:none;border:none;color:var(--sub);font-size:.74rem;cursor:pointer;text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wd{text-align:center;font-size:.68rem;color:var(--sub);padding-bottom:2px}
  .wd.sat{color:#7fb0ff}.wd.sun{color:#ff8a8a}
  .cell{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;
    background:var(--card);cursor:pointer;padding:4px 5px;display:flex;flex-direction:column;
    align-items:flex-start;transition:.1s;overflow:hidden}
  .cell .num{font-size:.7rem;color:var(--sub);line-height:1}
  .cell .ic{flex:1;display:flex;align-items:center;justify-content:center;width:100%;font-size:1.15rem}
  .cell .lbl{font-size:.6rem;font-weight:800;text-align:center;width:100%;line-height:1;padding-bottom:1px}
  .cell.out{opacity:.28;pointer-events:none}
  .cell.day{background:rgba(244,183,64,.16);border-color:rgba(244,183,64,.4)}
  .cell.day .lbl{color:#f4b740}
  .cell.night{background:rgba(108,123,214,.2);border-color:rgba(108,123,214,.5)}
  .cell.night .lbl{color:#aab4ee}
  .cell.off{background:rgba(74,85,112,.16)}
  .cell.off .lbl{color:#8f9cbb}
  .cell.sel{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .cell.today .num{background:var(--accent);color:#fff;border-radius:99px;padding:1px 5px;margin:-1px 0 0 -2px}
  .cell .ebadge{position:absolute;top:2px;right:3px;font-size:.52rem;font-weight:800;color:#ffd479;background:#5a3d10;border-radius:4px;padding:0 3px}
  .cell .wbadge{position:absolute;bottom:1px;right:2px;font-size:.6rem;line-height:1}
  .cal-legend{display:flex;gap:12px;justify-content:center;margin-top:12px;font-size:.68rem;color:var(--sub)}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  .sw.day{background:var(--day)}.sw.night{background:var(--night)}.sw.off{background:var(--off)}

  /* suggestion */
  .sug{background:linear-gradient(160deg,#1c2b4d,#16223c);border:1px solid rgba(79,140,255,.5);border-radius:14px;padding:16px}
  .sug .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(127,169,255,.25)}
  .sug .head .big{font-size:1.5rem}
  .sug .head .ttl{font-weight:800;font-size:1.02rem}
  .sug .head .sm{font-size:.72rem;color:var(--sub)}
  .sug .head .etgl{margin-left:auto;flex-shrink:0;font-size:.72rem;font-weight:800;border-radius:8px;
    padding:7px 11px;cursor:pointer;border:1px solid var(--line);color:var(--sub);background:rgba(0,0,0,.2)}
  .sug .head .etgl.on{background:#5a3d10;border-color:#f4b740;color:#ffd479}
  .sug ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .sug li{display:flex;gap:10px;font-size:.86rem;align-items:flex-start}
  .sug li .k{flex-shrink:0;width:70px;color:#9fb4e6;font-weight:700;font-size:.78rem;padding-top:1px}
  .sug li .v{flex:1}
  .sug li .v b{color:#fff}
  .branch{margin-top:12px;background:rgba(10,16,32,.5);border-radius:8px;padding:10px 12px;font-size:.78rem;color:var(--sub)}
  .branch b{color:#ffd479}
  .warn{margin-top:10px;background:rgba(184,64,47,.16);border:1px solid rgba(184,64,47,.55);
    border-radius:8px;padding:9px 12px;font-size:.78rem;color:#ffb4a0;line-height:1.6}
  .warn b{color:#ffd479}

  /* 24h timeline */
  .tl{margin:2px 0 14px}
  .tl .bar{height:26px;border-radius:6px;display:flex;overflow:hidden;background:#0b1120;position:relative}
  .tl .seg{height:100%}
  .tl .nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ff8a8a;box-shadow:0 0 6px rgba(255,138,138,.9);border-radius:2px}
  .tl .nowtag{position:absolute;top:-15px;transform:translateX(-50%);font-size:.58rem;color:#ff8a8a;font-weight:800}
  .tl .ticks{display:flex;justify-content:space-between;font-size:.6rem;color:var(--sub);margin-top:4px}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--sub);font-size:.85rem}

  /* week band */
  .band-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .brow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .brow .bd{width:26px;font-size:.7rem;color:var(--sub);flex-shrink:0}
  .band{flex:1;height:16px;border-radius:4px;display:flex;overflow:hidden;background:#0b1120}
  .seg{height:100%}
  .s-sleep{background:var(--sleep)}.s-work-day{background:var(--day)}.s-work-night{background:var(--night)}.s-free{background:var(--free)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:11px;font-size:.68rem;color:var(--sub)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .share{width:100%;margin-top:12px;background:var(--free);color:#04240f;border:none;border-radius:10px;height:42px;font-weight:800;font-size:.9rem;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#04240f;color:#c9f5da;border:1px solid var(--free);padding:10px 18px;border-radius:99px;font-size:.82rem;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
<div class="app">
  <div class="proto">◍ 動く試作(プロトタイプ)— データは端末内のみ</div>
  <header class="top">
    <span class="logo">シフトリズム</span>
    <span class="tag">2交代 / 昼・夜・休</span>
  </header>

  <!-- 0. now -->
  <section class="sec" style="padding-bottom:0">
    <div id="now"></div>
  </section>

  <!-- 1. block entry -->
  <section class="sec">
    <h2>① シフトを入れる（まとめてポン）</h2>
    <div class="entry">
      <div class="types">
        <button class="type-btn on" data-k="day"><span class="ic">☀️</span>昼勤</button>
        <button class="type-btn" data-k="night"><span class="ic">🌙</span>夜勤</button>
        <button class="type-btn" data-k="off"><span class="ic">😴</span>休み</button>
      </div>
      <div class="row">
        <div class="stepper">
          <button id="minus">−</button>
          <div class="n"><span id="cnt">4</span><small>日ぶん</small></div>
          <button id="plus">＋</button>
        </div>
        <button class="add" id="add">＋ 追加する</button>
      </div>
    </div>
    <p class="hint">周期で回らなくてOK。確定した並びを「昼勤×4」みたいに置くだけ。</p>
  </section>

  <!-- 2. month calendar -->
  <section class="sec">
    <h2>② シフトカレンダー（日をタップで整え方）</h2>
    <div class="cal-head">
      <button id="prevM">‹</button>
      <div class="mo" id="moLabel"></div>
      <button id="nextM">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="cal-legend">
      <span><i class="sw day"></i>昼勤</span>
      <span><i class="sw night"></i>夜勤</span>
      <span><i class="sw off"></i>休み</span>
      <span style="color:#ffd479">早=早出</span>
    </div>
    <div class="cal-actions"><button id="clear">ぜんぶ消す</button></div>
  </section>

  <!-- 3. suggestion -->
  <section class="sec" id="sugSec">
    <h2>③ その日の整え方</h2>
    <div id="sug"></div>
  </section>

  <!-- 4. family share -->
  <section class="sec">
    <h2>④ 家族に共有（“回復時間”が伝わる今週）</h2>
    <div class="band-wrap">
      <div id="bands"></div>
      <div class="legend">
        <span><i class="dot s-work-day"></i>昼勤</span>
        <span><i class="dot s-work-night"></i>夜勤</span>
        <span><i class="dot s-sleep"></i>睡眠(起こさないで)</span>
        <span><i class="dot s-free"></i>フリー</span>
      </div>
      <button class="share" id="share">📷 画像にして家族にLINEで送る</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const WD=['日','月','火','水','木','金','土'];
const TYPES={
  day:{k:'day',label:'昼勤',ic:'☀️',start:'8:30',end:'19:00',early:{start:'8:00',end:'18:30'}},
  night:{k:'night',label:'夜勤',ic:'🌙',start:'22:00',end:'翌8:30',early:{start:'21:00',end:'翌8:00'}},
  off:{k:'off',label:'休み',ic:'😴'}
};
let pickType='day', cnt=4;
let days=[];              // {type,early,date}
let selDate=null;         // Date
let viewY, viewM;

function addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d;}
function keyOf(d){return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function sameDay(a,b){return a&&b&&keyOf(a)===keyOf(b);}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
function lastDate(){return days.length?days[days.length-1].date:addDays(today0(),-1);}

const STORE='shiftrhythm-proto-v1';
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(days.map(d=>({t:d.type,e:d.early,d:d.date.getTime()}))));}catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(STORE); if(!raw)return false;
    const arr=JSON.parse(raw); if(!Array.isArray(arr)||!arr.length)return false;
    days=arr.map(x=>({type:x.t,early:!!x.e,date:new Date(x.d)}));
    return true;
  }catch(e){return false;}
}

function seed(){
  const runs=[['day',4],['off',1],['night',4],['off',3],['day',2],['off',2],['night',2],['off',3]];
  const t=today0();
  days=[]; let i=0;
  runs.forEach(([k,n])=>{for(let j=0;j<n;j++){days.push({type:k,early:false,date:addDays(t,i)});i++;}});
}

function render(){ renderNow(); renderCal(); renderSug(); renderBands(); }

function renderCal(){
  document.getElementById('moLabel').textContent=`${viewY}年 ${viewM+1}月`;
  const grid=document.getElementById('grid'); grid.innerHTML='';
  WD.forEach((w,i)=>{const h=document.createElement('div');h.className='wd'+(i===6?' sat':i===0?' sun':'');h.textContent=w;grid.appendChild(h);});
  const byDate={}; days.forEach((d,i)=>byDate[keyOf(d.date)]=i);
  const first=new Date(viewY,viewM,1);
  const start=addDays(first,-first.getDay());
  for(let c=0;c<42;c++){
    const date=addDays(start,c);
    const inMo=date.getMonth()===viewM;
    const entry=byDate[keyOf(date)];
    const cell=document.createElement('div');
    let cls='cell'+(inMo?'':' out');
    if(entry!==undefined) cls+=' '+days[entry].type;
    if(sameDay(date,selDate)) cls+=' sel';
    if(sameDay(date,today0())) cls+=' today';
    cell.className=cls;
    const T=entry!==undefined?TYPES[days[entry].type]:null;
    cell.innerHTML=`<span class="num">${date.getDate()}</span>`+
      (T?`<span class="ic">${T.ic}</span><span class="lbl">${T.label}</span>`:'<span class="ic"></span>')+
      (T&&days[entry].early?'<span class="ebadge">早</span>':'')+
      (T&&warnsFor(entry).length?'<span class="wbadge">⚠️</span>':'');
    if(inMo) cell.addEventListener('click',()=>{selDate=date;render();});
    grid.appendChild(cell);
  }
}

function renderSug(){
  const box=document.getElementById('sug');
  const idx=days.findIndex(d=>sameDay(d.date,selDate));
  if(idx<0){box.innerHTML='<div class="empty">カレンダーの日をタップすると、その日の整え方が出ます。</div>';return;}
  const d=days[idx], next=days[idx+1], prev=days[idx-1], early=d.early;
  let icon,ttl,sm,items=[],branch='',tgl='';
  if(d.type==='day'){
    icon='☀️'; ttl='昼勤の日'; sm=early?'早出 8:00–18:30':'8:30–19:00';
    const bed=early?'23:00':'23:30', wake=early?'6:15':'6:45';
    items=[
      ['就寝/起床',`<b>${bed}就寝 / ${wake}起床</b>（約7時間）`],
      ['光','起きたらすぐカーテンを開ける。通勤で自然光を浴びる'],
      ['食事',`朝${early?'6:30':'7:00'}／昼(休憩)／夕は帰宅後 軽め`],
      ['仮眠','帰宅後の仮眠はNG（夜眠れなくなる）。眠ければ昼休憩に10分'],
      ['カフェイン',`昼休憩まで。遅くとも ${early?'14:00':'14:30'}`]
    ];
    tgl='e';
  } else if(d.type==='night'){
    icon='🌙'; ttl='夜勤の日'; sm=early?'早出 21:00–翌8:00':'22:00–翌8:30';
    const nap=early?'13:00–17:00':'14:00–18:00', caf=early?'3:00':'4:00';
    items=[
      ['出勤前',`<b>${nap} に主睡眠（約4時間）</b>を固める`],
      ['光','勤務中は明るく保つ／帰宅時はサングラス・帽子で光を避ける'],
      ['食事','出勤前に主食／深夜1–2時に軽食／明けの朝は軽め'],
      ['仮眠(勤務中)','眠気ピークの 2:00–4:00 に 20–30分'],
      ['カフェイン',`前半に。明け方 ${caf} 以降は摂らない`]
    ];
    branch = !next? '' : next.type==='night'
      ? '<b>翌朝の明け：</b>また夜勤なので、帰宅後 9:30〜14:00 にしっかり寝て夜勤リズムを維持。'
      : '<b>翌朝の明け：</b>次が'+(next.type==='off'?'休み':'昼勤')+'なので、昼の睡眠は2〜3時間で切り上げ→夜に早め就寝でリセット。';
    tgl='e';
  } else {
    icon='😴'; ttl='休みの日';
    const resetting = prev && prev.type==='night';
    sm = resetting?'夜勤明けからのリセット日':'';
    items = resetting ? [
      ['睡眠','昼の寝すぎに注意。2〜3時間で切り上げ、夜に早め就寝で通常リズムへ'],
      ['光','日中はしっかり光を浴びる'],
      ['用事','買い物や家族の予定はこの日に寄せると回しやすい']
    ] : [
      ['睡眠','起床時刻を大きくズラさない（寝だめしすぎない）'],
      ['過ごし方','次の勤務が昼か夜かで前日夜の就寝時刻を寄せておく']
    ];
  }
  const tglBtn = tgl==='e' ? `<button class="etgl${early?' on':''}" id="etgl">${early?'早出 ✓':'早出にする'}</button>` : '';
  // 24hタイムライン(今日なら「いま」の線つき)
  const isToday=sameDay(d.date,today0());
  let nowline='';
  if(isToday){
    const n=new Date(); const p=((n.getHours()+n.getMinutes()/60)/24*100).toFixed(2);
    nowline=`<span class="nowline" style="left:${p}%"></span><span class="nowtag" style="left:${p}%">いま</span>`;
  }
  const tlHtml=`<div class="tl"><div class="bar">${segHtml(segsFor(idx))}${nowline}</div>
    <div class="ticks"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div></div>`;
  const warns=warnsFor(idx);
  box.innerHTML=`<div class="sug">
    <div class="head"><span class="big">${icon}</span>
      <div><div class="ttl">${d.date.getMonth()+1}/${d.date.getDate()}（${WD[d.date.getDay()]}） ${ttl}</div>
      <div class="sm">${sm||''}</div></div>${tglBtn}</div>
    ${tlHtml}
    <ul>${items.map(([k,v])=>`<li><span class="k">${k}</span><span class="v">${v}</span></li>`).join('')}</ul>
    ${branch?`<div class="branch">${branch}</div>`:''}
    ${warns.map(w=>`<div class="warn">⚠ ${w}</div>`).join('')}</div>`;
  const et=document.getElementById('etgl');
  if(et) et.addEventListener('click',()=>{days[idx].early=!days[idx].early;save();render();});
}

// その日の0〜24時を実時刻で区分(前日が夜勤かで朝の中身が変わる)
function segsFor(i){
  const d=days[i], prev=days[i-1];
  const pN=prev&&prev.type==='night';
  const e=d.early;
  if(d.type==='day'){
    const ws=e?8:8.5, we=e?18.5:19, bed=e?23:23.5, wake=e?6.25:6.75;
    return [['sleep',0,wake],['free',wake,ws],['work-day',ws,we],['free',we,bed],['sleep',bed,24]];
  }
  if(d.type==='night'){
    const ws=e?21:22;
    if(pN) return [['work-night',0,8.5],['free',8.5,9.5],['sleep',9.5,14],['free',14,ws],['work-night',ws,24]];
    return [['sleep',0,6.75],['free',6.75,14],['sleep',14,18],['free',18,ws],['work-night',ws,24]];
  }
  // 休み
  if(pN) return [['work-night',0,8.5],['free',8.5,9.5],['sleep',9.5,12.5],['free',12.5,22.5],['sleep',22.5,24]];
  return [['sleep',0,7],['free',7,23],['sleep',23,24]];
}
function segHtml(segs){
  return segs.map(([k,s,e])=>`<span class="seg s-${k}" style="width:${((e-s)/24*100).toFixed(2)}%"></span>`).join('');
}
function fmtH(x){const H=Math.floor(x),M=Math.round((x-H)*60);return `${H}:${String(M).padStart(2,'0')}`;}

// キツい並びの検知(ルールベース)
function warnsFor(idx){
  const d=days[idx]; if(!d)return[];
  const out=[];
  if(d.type==='night'){
    let run=1; for(let j=idx-1;j>=0&&days[j].type==='night';j--)run++;
    if(run>=3) out.push(`<b>夜勤${run}連目。</b>疲労が溜まりやすい並び。勤務中の仮眠(2:00–4:00)を必ず確保、食事は軽めに`);
    const nx=days[idx+1];
    if(nx&&nx.type==='day') out.push('<b>翌日そのまま昼勤。</b>もっともキツい切替。明けの睡眠は2時間までで切り上げ、夜は最速で就寝');
  }
  if(d.type==='day'){
    const pv=days[idx-1];
    if(pv&&pv.type==='night') out.push('<b>夜勤明け直後の昼勤。</b>体内時計が真逆のまま。今日は無理せず、帰宅後すぐ就寝');
  }
  return out;
}

// 「いま」カード: 現在の状態と次の予定
function renderNow(){
  const box=document.getElementById('now'); if(!box)return;
  const t=today0(); const idx=days.findIndex(x=>sameDay(x.date,t));
  if(idx<0){box.innerHTML='<div class="now"><span class="ic">📅</span><div><div class="st">きょう</div><div class="main">シフト未入力</div></div></div>';return;}
  const d=days[idx], T=TYPES[d.type];
  const n=new Date(); const h=n.getHours()+n.getMinutes()/60;
  const segs=segsFor(idx);
  const NAMES={'work-day':'勤務中','work-night':'勤務中','sleep':'睡眠推奨タイム','free':'フリータイム'};
  const cur=segs.find(([k,s,e])=>h>=s&&h<e);
  const nxt=segs.find(([k,s])=>s>h);
  let curTxt='—';
  if(cur){
    const endTxt=(cur[0]==='work-night'&&cur[2]===24)?(d.early?'翌8:00':'翌8:30'):fmtH(cur[2]);
    curTxt=`${NAMES[cur[0]]}（〜${endTxt}）`;
  }
  function dur(x){const m=Math.max(1,Math.round(x*60));const H=Math.floor(m/60),M=m%60;return (H?H+'時間':'')+(M||!H?M+'分':'');}
  const nxtLabel=nxt?(nxt[0].startsWith('work')?T.label+'へ':nxt[0]==='sleep'?'就寝推奨':'フリー'):'';
  box.innerHTML=`<div class="now"><span class="ic">${T.ic}</span>
    <div><div class="st">きょう ${d.date.getMonth()+1}/${d.date.getDate()}(${WD[d.date.getDay()]}) ${T.label}${d.early?'・早出':''}</div>
    <div class="main">${curTxt}</div></div>
    ${nxt?`<div class="cd"><div class="t">あと${dur(nxt[1]-h)}</div><div class="l">${fmtH(nxt[1])} ${nxtLabel}</div></div>`:''}</div>`;
}
function renderBands(){
  const box=document.getElementById('bands'); box.innerHTML='';
  // 今日以降の7日間を表示(過去分はスキップ)
  const t=today0();
  let start=days.findIndex(d=>d.date>=t);
  if(start<0) start=Math.max(0,days.length-7);
  if(!days.slice(start,start+7).length){box.innerHTML='<div style="font-size:.8rem;color:var(--sub);text-align:center;padding:8px">シフトを入れると今週のリズムが出ます</div>';return;}
  for(let i=start;i<Math.min(start+7,days.length);i++){
    const d=days[i];
    const row=document.createElement('div'); row.className='brow';
    const isToday=sameDay(d.date,t);
    row.innerHTML=`<span class="bd" style="${isToday?'color:#ffd479;font-weight:800':''}">${d.date.getDate()}${WD[d.date.getDay()]}</span><div class="band">${segHtml(segsFor(i))}</div>`;
    box.appendChild(row);
  }
}

// controls
document.querySelectorAll('.type-btn').forEach(b=>b.addEventListener('click',()=>{
  pickType=b.dataset.k;
  document.querySelectorAll('.type-btn').forEach(x=>x.classList.toggle('on',x===b));
}));
document.getElementById('plus').onclick=()=>{cnt=Math.min(14,cnt+1);document.getElementById('cnt').textContent=cnt;};
document.getElementById('minus').onclick=()=>{cnt=Math.max(1,cnt-1);document.getElementById('cnt').textContent=cnt;};
document.getElementById('add').onclick=()=>{
  const base=lastDate();
  const firstNew=addDays(base,1);
  for(let i=1;i<=cnt;i++) days.push({type:pickType,early:false,date:addDays(base,i)});
  selDate=firstNew; viewY=firstNew.getFullYear(); viewM=firstNew.getMonth();
  save(); render();
  toast(`${TYPES[pickType].label} を ${cnt}日 追加`);
};
document.getElementById('clear').onclick=()=>{
  if(!days.length)return;
  if(!confirm('入れたシフトをすべて消します。よろしいですか?'))return;
  days=[];selDate=null;save();render();
};
document.getElementById('prevM').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--;}renderCal();};
document.getElementById('nextM').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++;}renderCal();};
document.getElementById('share').onclick=()=>toast('（試作）今週のリズムを画像にして共有します');

let tmr;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('show'),1800);}

// init: 保存データがあれば復元、なければサンプルを投入
if(!load()){ seed(); save(); }
const tNow=today0();
const todayEntry=days.find(d=>sameDay(d.date,tNow));
const firstNight=days.find(d=>d.type==='night'&&d.date>=tNow);
selDate=todayEntry?todayEntry.date:(firstNight?firstNight.date:(days[0]&&days[0].date));
viewY=tNow.getFullYear(); viewM=tNow.getMonth();
render();
// 「いま」カードとタイムラインの現在線を1分ごとに更新
setInterval(()=>{renderNow();renderSug();},60000);
</script>
