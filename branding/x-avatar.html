<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:400px;height:400px;overflow:hidden;
  font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif}
.a{width:400px;height:400px;position:relative;
  background:radial-gradient(300px 300px at 50% 30%,#1c2b4d,#0d1220);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8edf7}
.moon{font-size:110px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 20px rgba(127,169,255,.6))}
.name{font-size:52px;font-weight:800;letter-spacing:2px}
.name .em{color:#7fa9ff}
.bands{display:flex;gap:7px;margin-top:20px}
.dot{width:26px;height:12px;border-radius:3px}
.day{background:#f4b740}.night{background:#6c7bd6}.sleep{background:#35507a}.free{background:#3fae7a}
</style></head><body>
<div class="a">
  <div class="moon">🌙</div>
  <div class="name">シフト<span class="em">リズム</span></div>
  <div class="bands"><span class="dot day"></span><span class="dot night"></span><span class="dot sleep"></span><span class="dot free"></span></div>
</div>
</body></html>
