<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OW2 ヒーローガイド</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080e1c;
      color: #dde6f5;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic Pro', sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #111830 0%, #0a1020 100%);
      border-bottom: 3px solid #f99e1a;
      padding: 24px 20px;
      text-align: center;
    }
    header h1 { font-size: 2rem; color: #f99e1a; text-shadow: 0 0 24px rgba(249,158,26,0.55); letter-spacing: 3px; }
    header p  { color: #7a90b8; margin-top: 6px; font-size: 0.95rem; }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }

    .role-section { margin-bottom: 28px; }
    .role-label {
      font-size: 0.82rem; font-weight: 700; letter-spacing: 2px;
      padding: 5px 14px; border-radius: 4px; display: inline-block; margin-bottom: 12px;
    }
    .role-tank .role-label { background: #2d5abf; }
    .role-dmg  .role-label { background: #c03030; }
    .role-sup  .role-label { background: #258048; }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 8px;
    }
    .hero-card {
      background: #131d35; border: 2px solid transparent;
      border-radius: 8px; padding: 9px 5px; text-align: center;
      cursor: pointer; transition: all 0.18s ease;
    }
    .hero-card:hover   { border-color: #f99e1a; transform: translateY(-3px); background: #1b2848; }
    .hero-card.selected{ border-color: #f99e1a; background: #232f55; box-shadow: 0 0 18px rgba(249,158,26,0.45); }
    .hero-card .h-icon { font-size: 1.9rem; display: block; margin-bottom: 4px; }
    .hero-card .h-name { font-size: 0.63rem; color: #99aece; font-weight: 600; line-height: 1.3; }

    /* ── Result Panel ── */
    .result-panel {
      display: none; background: #0c1525;
      border: 1px solid #1e2e50; border-radius: 12px;
      padding: 24px; margin-top: 24px; animation: fadeUp 0.28s ease;
    }
    .result-panel.visible { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .sel-hero { display:flex; align-items:center; gap:16px; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid #1e2e50; }
    .sel-hero .big-icon { font-size: 3.6rem; }
    .sel-hero .sel-name  { font-size: 1.8rem; font-weight: 700; color: #f99e1a; }
    .sel-hero .sel-role  { font-size: 0.85rem; color: #6a84b0; margin-top: 3px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 580px) { .info-grid { grid-template-columns: 1fr; } }

    .info-box { background: #131d35; border-radius: 8px; padding: 16px; }
    .info-box h3 { font-size: 0.9rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e2e50; }
    .box-anti h3 { color: #ff6060; }
    .box-syn  h3 { color: #50d880; }

    .h-list { list-style: none; }
    .h-list li { display:flex; align-items:flex-start; gap:10px; padding:8px; border-radius:6px; margin-bottom:7px; background:#0c1525; }
    .h-list li .li-icon { font-size: 1.5rem; flex-shrink: 0; margin-top: 1px; }
    .h-list li .li-name { font-weight: 700; font-size: 0.85rem; }
    .h-list li .li-why  { font-size: 0.72rem; color: #7a90b8; margin-top: 2px; line-height: 1.5; }
    .box-anti .h-list li { border-left: 3px solid #ff6060; }
    .box-syn  .h-list li { border-left: 3px solid #50d880; }

    /* ── Anti-pick role sub-sections ── */
    .anti-role-section { margin-bottom: 10px; }
    .anti-role-section:last-child { margin-bottom: 0; }
    .anti-role-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px;
      color: #ff9090; opacity: 0.75; margin-bottom: 5px; padding-left: 2px;
    }

    .tips-box { margin-top: 18px; background: #131d35; border-radius: 8px; padding: 16px; border-left: 3px solid #f99e1a; }
    .tips-box h3 { color: #f99e1a; margin-bottom: 8px; font-size: 0.9rem; }
    .tips-box p  { color: #99aece; font-size: 0.87rem; line-height: 1.7; }

    /* ── Bulletin Board ── */
    .board-section { margin-top: 18px; background: #131d35; border-radius: 8px; padding: 16px; }
    .board-section > h3 {
      font-size: 0.9rem; color: #aabbdd; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: 1px solid #1e2e50;
      display: flex; align-items: center; gap: 8px;
    }
    .anon-badge {
      font-size: 0.65rem; background: #1e2e50; color: #6a84b0;
      padding: 2px 8px; border-radius: 10px; font-weight: 600; letter-spacing: 1px;
    }

    .board-posts { margin-bottom: 14px; }
    .board-post {
      background: #0c1525; border-radius: 6px; padding: 10px 12px;
      margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start;
    }
    .post-badge {
      font-size: 0.68rem; padding: 2px 7px; border-radius: 10px;
      font-weight: 600; flex-shrink: 0; margin-top: 2px; white-space: nowrap;
    }
    .badge-anti    { background: rgba(255,96,96,0.15);  color: #ff6060; border: 1px solid rgba(255,96,96,0.4); }
    .badge-syn     { background: rgba(80,216,128,0.15); color: #50d880; border: 1px solid rgba(80,216,128,0.4); }
    .badge-comment { background: rgba(170,187,221,0.1); color: #99aece; border: 1px solid rgba(170,187,221,0.3); }
    .post-body { flex: 1; min-width: 0; }
    .post-hero { font-size: 0.8rem; font-weight: 700; color: #f99e1a; margin-bottom: 3px; }
    .post-text { font-size: 0.82rem; color: #99aece; line-height: 1.5; word-break: break-word; }
    .post-like { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
    .like-btn {
      background: none; border: 1px solid #2a3a5a; border-radius: 4px;
      color: #5a7aaa; cursor: pointer; padding: 3px 8px; font-size: 0.9rem;
      transition: all 0.15s; line-height: 1;
    }
    .like-btn:hover { border-color: #f99e1a; color: #f99e1a; }
    .like-btn.liked { border-color: #f99e1a; color: #f99e1a; background: rgba(249,158,26,0.1); }
    .like-count { font-size: 0.72rem; color: #5a7aaa; }

    .board-form { border-top: 1px solid #1e2e50; padding-top: 14px; }
    .board-form-title { font-size: 0.8rem; color: #6a84b0; margin-bottom: 10px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .board-select, .board-input {
      background: #0c1525; border: 1px solid #2a3a5a; border-radius: 5px;
      color: #dde6f5; padding: 7px 10px; font-size: 0.82rem; outline: none;
    }
    .board-select:focus, .board-input:focus, .board-textarea:focus { border-color: #f99e1a; }
    .board-input { flex: 1; min-width: 100px; }
    .board-textarea {
      width: 100%; background: #0c1525; border: 1px solid #2a3a5a; border-radius: 5px;
      color: #dde6f5; padding: 8px 10px; font-size: 0.82rem; resize: vertical;
      min-height: 62px; outline: none; font-family: inherit; margin-bottom: 8px; display: block;
    }
    .board-submit {
      background: #f99e1a; border: none; border-radius: 5px; color: #080e1c;
      font-weight: 700; font-size: 0.85rem; padding: 8px 18px; cursor: pointer; transition: background 0.15s;
    }
    .board-submit:hover { background: #ffb340; }
    .board-empty { font-size: 0.82rem; color: #3a4a6a; text-align: center; padding: 18px 0; }

    footer { text-align:center; color:#3a4a6a; font-size:0.75rem; padding:30px 10px; margin-top:20px; }
  </style>
</head>
<body>

<header>
  <h1>⚔ OW2 ヒーローガイド</h1>
  <p>ヒーローを選択 → アンチピック・シナジーを確認</p>
</header>

<div class="container">

  </div>
  <div class="role-section role-dmg">
    <div class="role-label">⚔ DAMAGE</div>
    <div class="hero-grid" id="grid-dmg"></div>
  </div>
  <div class="role-section role-sup">
    <div class="role-label">💚 SUPPORT</div>
    <div class="hero-grid" id="grid-sup"></div>
  </div>

  <div class="result-panel" id="result-panel">
    <div class="sel-hero">
      <span class="big-icon" id="r-icon"></span>
      <div>
        <div class="sel-name" id="r-name"></div>
        <div class="sel-role" id="r-role"></div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box box-anti">
        <h3>⚠ アンチピック（苦手なヒーロー）</h3>
        <div id="list-anti"></div>
      </div>
      <div class="info-box box-syn">
        <h3>✨ シナジー（相性の良いヒーロー）</h3>
        <ul class="h-list" id="list-syn"></ul>
      </div>
    </div>

    <div class="tips-box">
      <h3>💡 プレイのコツ</h3>
      <p id="r-tips"></p>
    </div>

    <!-- 掲示板 -->
    <div class="board-section">
      <h3>💬 コミュニティ掲示板 <span class="anon-badge">匿名</span></h3>
      <div class="board-posts" id="board-posts"></div>
      <div class="board-form">
        <div class="board-form-title">👇 追加情報を投稿する（匿名・いいねが多い順に表示）</div>
        <div class="form-row">
          <select id="board-cat" class="board-select">
            <option value="anti">⚠ アンチピック</option>
            <option value="syn">✨ シナジー</option>
            <option value="comment">💬 その他</option>
          </select>
          <input id="board-hero" class="board-input" placeholder="ヒーロー名（任意）" maxlength="20" />
        </div>
        <textarea id="board-text" class="board-textarea" placeholder="理由やコメントを入力... (200文字まで)" maxlength="200"></textarea>
        <button type="button" class="board-submit" onclick="submitPost()">投稿する</button>
      </div>
    </div>
  </div>
</div>

<footer>OW2 ヒーローガイド — 非公式ファンサイト / Overwatch® は Blizzard Entertainment の登録商標です</footer>

// ================================================================
//  UI描画
// ================================================================
const GRID_MAP = { tank: "grid-tank", dmg: "grid-dmg", sup: "grid-sup" };
let currentHeroId = null;

Object.entries(HEROES).forEach(([id, hero]) => {
  const grid = document.getElementById(GRID_MAP[hero.role]);
  if (!grid) return;
  const card = document.createElement("div");
  card.className = "hero-card";
  card.dataset.id = id;
  card.innerHTML = `<span class="h-icon">${hero.icon}</span><span class="h-name">${hero.name}</span>`;
  card.addEventListener("click", () => selectHero(id));
  grid.appendChild(card);
});

function roleLabel(r) {
  return { tank: "🛡 タンク", dmg: "⚔ ダメージ", sup: "💚 サポート" }[r] || r;
}

function buildList(listEl, items) {
  listEl.innerHTML = "";
  items.forEach(({ id, why }) => {
    const h = HEROES[id];
    if (!h) return;
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="li-icon">${h.icon}</span>
      <div>
        <div class="li-name">${h.name}</div>
        <div class="li-why">${why}</div>
      </div>`;
    listEl.appendChild(li);
  });
}

function buildAntiList(containerEl, counters) {
  containerEl.innerHTML = "";
  const roles = [
    { key: "tank", label: "🛡 タンク" },
    { key: "dmg",  label: "⚔ ダメージ" },
    { key: "sup",  label: "💚 サポート" },
  ];
  roles.forEach(({ key, label }) => {
    const items = counters[key];
    if (!items || items.length === 0) return;
    const section = document.createElement("div");
    section.className = "anti-role-section";
    const roleLabel = document.createElement("div");
    roleLabel.className = "anti-role-label";
    roleLabel.textContent = label;
    section.appendChild(roleLabel);
    const ul = document.createElement("ul");
    ul.className = "h-list";
    items.forEach(({ id, why }) => {
      const h = HEROES[id];
      if (!h) return;
      const li = document.createElement("li");
      li.innerHTML = `
        <span class="li-icon">${h.icon}</span>
        <div>
          <div class="li-name">${h.name}</div>
          <div class="li-why">${why}</div>
        </div>`;
      ul.appendChild(li);
    });
    section.appendChild(ul);
    containerEl.appendChild(section);
  });
}

function selectHero(id) {
  document.querySelectorAll(".hero-card").forEach(c => c.classList.remove("selected"));
  document.querySelector(`[data-id="${id}"]`).classList.add("selected");
  currentHeroId = id;

  const hero = HEROES[id];
  document.getElementById("r-icon").textContent = hero.icon;
  document.getElementById("r-name").textContent = hero.name;
  document.getElementById("r-role").textContent = roleLabel(hero.role);
  document.getElementById("r-tips").textContent = hero.tips;

  buildAntiList(document.getElementById("list-anti"), hero.counters);
  buildList(document.getElementById("list-syn"),  hero.synergies);

  const panel = document.getElementById("result-panel");
  panel.classList.add("visible");
  renderBoard(id);
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ================================================================
//  掲示板（localStorage）
// ================================================================
const STORE_KEY = "ow2_board";
const LIKED_KEY = "ow2_liked";

let _memBoard = {};
let _memLiked = [];

function loadBoard() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || _memBoard; } catch { return _memBoard; }
}
function saveBoard(data) {
  _memBoard = data;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}

function loadLiked() {
  try { return JSON.parse(localStorage.getItem(LIKED_KEY)) || _memLiked; } catch { return _memLiked; }
}
function saveLiked(arr) {
  _memLiked = arr;
  try { localStorage.setItem(LIKED_KEY, JSON.stringify(arr)); } catch {}
}

function esc(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

const BADGE = {
  anti:    '<span class="post-badge badge-anti">⚠ アンチピック</span>',
  syn:     '<span class="post-badge badge-syn">✨ シナジー</span>',
  comment: '<span class="post-badge badge-comment">💬 その他</span>',
};

function renderBoard(heroId) {
  const board  = loadBoard();
  const liked  = loadLiked();
  const posts  = (board[heroId] || []).slice().sort((a, b) => b.likes - a.likes);
  const el     = document.getElementById("board-posts");

  if (posts.length === 0) {
    el.innerHTML = '<div class="board-empty">まだ投稿がありません。最初の投稿をしてみよう！</div>';
    return;
  }

  el.innerHTML = posts.map(p => {
    const isLiked = liked.includes(p.id);
    return `
      <div class="board-post">
        ${BADGE[p.category] || BADGE.comment}
        <div class="post-body">
          ${p.heroName ? `<div class="post-hero">${esc(p.heroName)}</div>` : ""}
          <div class="post-text">${esc(p.text)}</div>
        </div>
        <div class="post-like">
          <button class="like-btn ${isLiked ? "liked" : ""}"
            onclick="toggleLike('${esc(heroId)}','${esc(p.id)}')">👍</button>
          <span class="like-count">${p.likes}</span>
        </div>
      </div>`;
  }).join("");
}

function toggleLike(heroId, postId) {
  const board = loadBoard();
  const liked = loadLiked();
  const post  = (board[heroId] || []).find(p => p.id === postId);
  if (!post) return;

  const idx = liked.indexOf(postId);
  if (idx === -1) { post.likes++; liked.push(postId); }
  else            { post.likes = Math.max(0, post.likes - 1); liked.splice(idx, 1); }

  saveBoard(board);
  saveLiked(liked);
  renderBoard(heroId);
}

function submitPost() {
  if (!currentHeroId) return;
  const text = document.getElementById("board-text").value.trim();
  if (!text) { alert("コメントを入力してください"); return; }

  const board    = loadBoard();
  if (!board[currentHeroId]) board[currentHeroId] = [];

  board[currentHeroId].push({
    id:       Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    category: document.getElementById("board-cat").value,
    heroName: document.getElementById("board-hero").value.trim(),
    text,
    likes: 0,
  });

  saveBoard(board);
  document.getElementById("board-hero").value = "";
  document.getElementById("board-text").value = "";
  renderBoard(currentHeroId);
}
